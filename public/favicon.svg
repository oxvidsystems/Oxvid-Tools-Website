<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <defs>
    <linearGradient id="ot-badge" x1="4" y1="2" x2="28" y2="30" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2563EB"/>
      <stop offset="1" stop-color="#1949B8"/>
    </linearGradient>
  </defs>
  <rect x="1" y="1" width="30" height="30" rx="8" fill="url(#ot-badge)"/>
  <!-- O ring, left -->
  <circle cx="10.6" cy="16" r="5.6" fill="none" stroke="#FFFFFF" stroke-width="3"/>
  <!-- X ligature, right, its left stroke just kissing the ring -->
  <rect x="18.3" y="8.6" width="3.1" height="15" rx="1.55" fill="#FFFFFF" transform="rotate(32 19.85 16.1)"/>
  <rect x="18.3" y="8.6" width="3.1" height="15" rx="1.55" fill="#FFFFFF" transform="rotate(-32 19.85 16.1)"/>
  <!-- copper ascending accent, nods to the parent Oxvid Systems mark -->
  <circle cx="25.6" cy="7.4" r="2.2" fill="#B5651D"/>
</svg>
